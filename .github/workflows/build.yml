name: Build unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_runner: macos-26
            xcode_glob: "Xcode_26*"
            label: "macOS26-Xcode26"
          - os_runner: macos-15
            xcode_glob: "Xcode_16*"
            label: "macOS15-Xcode16"

    # ВНИМАНИЕ: сборка на macos-15/Xcode 16 (job "macOS15-Xcode16") почти
    # наверняка упадёт на компиляции — в коде используются Liquid Glass API
    # (.glassEffect, GlassEffectContainer, .buttonStyle(.glass)), которых
    # физически нет в SDK iOS 18 / Xcode 16. Эта job помечена continue-on-error,
    # чтобы не блокировать основную сборку на macos-26.
    runs-on: ${{ matrix.os_runner }}
    continue-on-error: ${{ matrix.os_runner == 'macos-15' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Доступные версии Xcode на раннере:"
          ls /Applications | grep -i xcode || true
          XCODE_PATH=$(ls -d /Applications/${{ matrix.xcode_glob }}.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::Xcode по шаблону ${{ matrix.xcode_glob }} не найден в /Applications на этом раннере"
            exit 1
          fi
          echo "Использую: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Cache SPM & DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          # Ключ кэша раньше зависел только от project.yml — значит правки
          # в Info.plist (например, добавление NSFaceIDUsageDescription)
          # не инвалидировали кэш DerivedData, и в архив мог попасть старый
          # обработанный Info.plist без нужного ключа. Добавляем сам
          # Info.plist в ключ, чтобы такие правки гарантированно пересобирались.
          # matrix.label добавлен, чтобы job'ы на разных Xcode не делили кэш.
          key: xcode-${{ matrix.label }}-${{ hashFiles('project.yml', 'ITDOApp/Info.plist') }}
          restore-keys: xcode-${{ matrix.label }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project ITDOApp.xcodeproj \
            -scheme ITDOApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/ITDOApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            -parallelizeTargets \
            archive | tee build/xcodebuild.log | tail -200

      - name: Verify archive exists
        run: |
          APP_PATH="build/ITDOApp.xcarchive/Products/Applications/ITDOApp.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Архив не найден по пути $APP_PATH — сборка провалилась, см. лог выше или артефакт xcodebuild-log"
            exit 1
          fi
          echo "OK: $APP_PATH существует"

      - name: Verify Info.plist keys made it into the build
        run: |
          # Защита от повторения бага, когда правки в Info.plist (например,
          # NSFaceIDUsageDescription) не попадали в финальный архив из-за
          # устаревшего закэшированного DerivedData. Если ключ отсутствует —
          # валим сборку сразу здесь, а не узнаём об этом через краш-репорт
          # на телефоне.
          PLIST_PATH="build/ITDOApp.xcarchive/Products/Applications/ITDOApp.app/Info.plist"
          echo "Содержимое собранного Info.plist:"
          plutil -p "$PLIST_PATH"
          if ! /usr/libexec/PlistBuddy -c "Print :NSFaceIDUsageDescription" "$PLIST_PATH" >/dev/null 2>&1; then
            echo "::error::NSFaceIDUsageDescription отсутствует в собранном Info.plist — код-пароль с Face ID будет крашить приложение на реальном устройстве"
            exit 1
          fi
          echo "OK: NSFaceIDUsageDescription присутствует в собранном Info.plist"

      - name: Upload full build log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ matrix.label }}
          path: build/xcodebuild.log
          retention-days: 7

      - name: Package .ipa (unsigned)
        run: |
          mkdir -p build/Payload
          cp -R "build/ITDOApp.xcarchive/Products/Applications/ITDOApp.app" build/Payload/
          cd build
          zip -r ITDOApp-unsigned.ipa Payload
          cd ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITDOApp-unsigned-ipa-${{ matrix.label }}
          path: build/ITDOApp-unsigned.ipa
          retention-days: 30            echo "::error::NSFaceIDUsageDescription отсутствует в собранном Info.plist — код-пароль с Face ID будет крашить приложение на реальном устройстве"
            exit 1
          fi
          echo "OK: NSFaceIDUsageDescription присутствует в собранном Info.plist"

      - name: Upload full build log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 7

      - name: Package .ipa (unsigned)
        run: |
          mkdir -p build/Payload
          cp -R "build/ITDOApp.xcarchive/Products/Applications/ITDOApp.app" build/Payload/
          cd build
          zip -r ITDOApp-unsigned.ipa Payload
          cd ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITDOApp-unsigned-ipa
          path: build/ITDOApp-unsigned.ipa
          retention-days: 30
